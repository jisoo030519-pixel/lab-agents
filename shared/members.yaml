# 연구실 명단
#
# 이 명단이 있어야 학회 프로그램에서 "우리 사람 발표"를 골라낼 수 있습니다.
#
#   name     : 표시 이름. 리포트·캘린더에 이 이름으로 나옵니다.
#   sid      : 학번
#   aliases  : 프로그램에 실릴 수 있는 모든 표기. 이게 이 파일의 핵심입니다.
#              공백과 대소문자는 알아서 무시합니다.
#
# 영문 표기는 랩 홈페이지(EPAD Lab)의 공식 표기를 그대로 옮긴 것입니다.
#    표기가 틀리면 국제 학회 프로그램에서 그 사람을 못 찾습니다.
#    실제로 추정값을 쓸 때 이나경(Nakyung → Na Gyeong)과 안재현(Ahn → An)이 어긋나 있었습니다.
#    새 구성원을 넣을 때도 홈페이지나 본인 논문의 표기를 확인해서 넣으세요.
#
#    "J. Kim" 같은 이니셜 표기는 일부러 넣지 않았습니다 —
#    동명이인이 너무 많아 엉뚱한 사람을 우리 사람으로 잡아냅니다.

# 소속 표기 — 이름 로마자 표기가 빗나가도 이걸로 잡아낸다.
# NAT 2026 에서 실제로 이름 검색은 놓치고 소속 검색이 찾아낸 발표가 2건 있었다.
