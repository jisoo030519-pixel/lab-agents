name = "lab-schedule"
main = "worker.js"
compatibility_date = "2026-01-01"

# Cloudflare 가 무료로 돌려주는 공개 AI 모델. API 키도 결제도 필요 없다.
# 하루 10,000 뉴런 무료 (매일 09:00 KST = 00:00 UTC 초기화).
[ai]
binding = "AI"

[vars]
# 일정 자료를 어디서 가져올지. 우리 사이트의 data.json 이다.
DATA_URL = "https://jisoo030519-pixel.github.io/lab-agents/data.json"

# 우리 사이트에서 온 요청만 받는다. 쉼표로 여러 개.
# 로컬에서 시험하려면 http://localhost:8765 를 임시로 넣으면 된다.
ALLOWED_ORIGINS = "https://jisoo030519-pixel.github.io"

# 등록 한도 — 돈은 안 들지만 막지 않으면 스팸으로 캘린더가 뒤덮인다
WRITE_PER_IP_HOUR = "20"

# AI 한도. 질문 하나에 대략 수십 뉴런이라 무료 한도 안에 들도록 하루 200건으로 막는다.
PER_IP_HOUR = "30"
DAILY_TOTAL = "200"

# 모델. 실제로 같은 질문("다음 주 수요일 오후 3시 세미나 등록해줘")을 두 모델에 던져 비교했다.
#   gemma-4-26b-a4b-it : 날짜 정확 · 답이 자연스러운 한국어 · 질문당 약 12 뉴런
#   qwen3-30b-a3b-fp8  : 날짜 정확 · "2026-09-16 15:00에" 식 딱딱한 답 · 약 26 뉴런
MODEL = "@cf/google/gemma-4-26b-a4b-it"

# ── 저장소 두 개 ──────────────────────────────────────────────
# 등록된 일정이 여기 쌓인다. 등록 기능에 반드시 필요하다.
[[kv_namespaces]]
binding = "EVENTS"
id = "183b16a6119a4cf4b0bf5ac81ff96ef7"

# 사용 횟수를 센다. 없으면 동작은 하지만 한도가 안 걸린다 (권장하지 않음).
[[kv_namespaces]]
binding = "RATE"
id = "5a3204dbc0964c2f855533b5f3705276"
