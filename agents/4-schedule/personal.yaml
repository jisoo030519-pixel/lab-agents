# 학회 밖의 내 일정 — 학기 정기 일정, 논문, 연구과제, 세미나
#
# 학회 일정은 에이전트가 사이트에서 긁어오지만, 이건 웹에 없으니 직접 적는다.
# 여기 적힌 것도 리포트·캘린더·대시보드에 학회 일정과 똑같이 합쳐진다.
#
#   title  : 무슨 일인지
#   kind   : revision(논문 수정본) / submission(논문 투고) / review(리뷰)
#            report(보고서) / proposal(제안서) / seminar(세미나) / meeting(미팅) / etc
#   due    : YYYY-MM-DD  — 하루짜리
#            시각이 있으면 YYYY-MM-DDTHH:MM
#   member : 누구 일정인지 (members.yaml 의 이름). 비우면 랩 공통.
#   note   : 부연
#
# 반복 일정은 repeat + until 로 적으면 자동으로 펼쳐진다.
#   repeat: weekly | monthly    + until: YYYY-MM-DD

items:
  # ---------------- 학기 정기 일정 ----------------
  # ⚠️ 학기 종료일을 2026-12-18 로 잡았습니다. 실제 학사일정에 맞게 고쳐주세요.
  #    중간·기말고사 주간이나 휴강 주는 자동으로 빠지지 않으니 그 주는 따로 관리해야 합니다.

  - title: 개인미팅
    kind: meeting
    due: 2026-09-08
    repeat: weekly
    until: 2026-12-18
    member: [이승훈, 안재현, 이나경, 오희진, 현지수]
    rotate: true            # 매주 순서를 자동으로 정한다 (사다리타기 대신)
    note: "화요일. 시각 미정 — 정해지면 due 를 2026-09-08T14:00 형태로 고치세요"

  - title: 학부스터디
    kind: meeting
    due: 2026-09-08T15:00
    repeat: weekly
    until: 2026-12-18
    member: [김소윤, 나승민, 이영한, 강서현]   # 학부생만. 김균영은 이번 학기 미참석
    note: "화 15:00~16:00. 학부생 대상"

  - title: 랩세미나
    kind: seminar
    due: 2026-09-04T11:00
    repeat: weekly
    until: 2026-12-18
    member: ""
    note: "금요일 대학원 수업 후, 비대면. 11시는 대략값이니 확정되면 고치세요"

  # ---------------- 논문 · 과제 ----------------
