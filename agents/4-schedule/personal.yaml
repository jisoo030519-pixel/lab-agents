# 학회 밖의 내 일정 — 학기 정기 일정, 논문, 연구과제, 세미나
#
# 학회 일정은 에이전트가 사이트에서 긁어오지만, 이건 웹에 없으니 직접 적는다.
# 여기 적힌 것도 리포트·캘린더·대시보드에 학회 일정과 똑같이 합쳐진다.
#
#   title  : 무슨 일인지
#   kind   : revision(논문 수정본) / submission(논문 투고) / review(리뷰)
#            report(보고서) / proposal(제안서) / seminar(세미나) / meeting(미팅) / etc
#   due    : YYYY-MM-DD  — 하루짜리
#            시각이 있으면 YYYY-MM-DDTHH:MM
#   member : 누구 일정인지 (members.yaml 의 이름). 비우면 랩 공통.
#   note   : 부연
#
# 반복 일정은 repeat + until 로 적으면 자동으로 펼쳐진다.
#   repeat: weekly | monthly    + until: YYYY-MM-DD

