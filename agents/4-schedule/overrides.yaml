# 정기 일정의 그 주만 바꾸는 예외
#
# 개인미팅·학부스터디·랩세미나는 매주 반복이지만, 어떤 주는 휴강하거나 시간이 바뀐다.
# 그런 주는 personal.yaml 을 건드리지 말고 여기에 한 줄 적는다.
# personal.yaml 을 고치면 학기 전체가 바뀌어버린다.
#
# ▣ 그 주 쉬기
