#
# ▣ 그 주만 다른 날/시간으로
#     - {title: 학부스터디, date: 2026-09-08, action: move, to: 2026-09-10T15:00}
#     - {title: 개인미팅,   date: 2026-09-08, action: move, to: 2026-09-09}
#
#   date : 원래 잡혀 있던 날 (이걸로 어떤 회차인지 찾는다)
#   to   : 옮길 곳. 시각까지 바꾸려면 YYYY-MM-DDTHH:MM, 날짜만이면 YYYY-MM-DD
#
# 대시보드 "일정 물어보기"에서 말로 바꾸면 여기 자동으로 들어온다.

