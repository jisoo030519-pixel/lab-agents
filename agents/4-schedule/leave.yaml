# 석사과정 연차 관리
#
# 연차를 여기 적으면 → 캘린더에 자동으로 뜨고 → 남은 연차가 자동 계산된다.
#
# ▣ 연차 하나 쓰는 법 (이것만 하면 됩니다)
#     leaves 아래에 한 줄 추가:
#       - {name: 이승훈, date: 2026-09-15}
#     반차면 half: true
#       - {name: 이승훈, date: 2026-09-15, half: true}
#     사유를 남기려면
#       - {name: 이승훈, date: 2026-09-15, note: "병원"}
#
# ▣ used_before 는 뭔가요
#     엑셀에 월별 사용 개수만 있고 날짜가 없어서, 그 부분은 집계로만 넣어둡니다.
#     남은 연차 계산에는 들어가지만 날짜를 모르니 캘린더에는 안 뜹니다.
#     날짜를 아시면 leaves 로 옮겨 적으면 됩니다.
#
#     남은 연차 = total − used_before 합계 − leaves 합계

year: 2026

people:
  - name: 이승훈
    total: 19
    used_before: {2026-01: 2, 2026-02: 1}

  - name: 안재현
    total: 27
    used_before: {2026-02: 1, 2026-07: 1}

  - name: 이나경
    total: 16
    used_before: {2026-02: 5}

  - name: 오희진
    total: 25
    used_before: {2026-01: 1, 2026-06: 1, 2026-08: 2}

  - name: 현지수
    total: 30
    used_before: {2026-05: 2, 2026-06: 1, 2026-08: 3}

# 날짜가 있는 연차 — 캘린더에 뜬다
leaves: []
